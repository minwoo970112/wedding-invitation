<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>우리의 결혼식에 초대합니다</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f4f1ec;
      font-family: "Arial", sans-serif;
      color: #333;
    }

    .invitation {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: #ffffff;
      text-align: center;
    }

    .main {
      min-height: 100vh;
      padding: 90px 25px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .small-title {
      font-size: 12px;
      letter-spacing: 4px;
      color: #999;
      margin-bottom: 35px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 31px;
      font-weight: normal;
      letter-spacing: 2px;
      margin-bottom: 14px;
    }

    .date {
      font-size: 14px;
      letter-spacing: 2px;
      color: #777;
      margin-bottom: 45px;
    }

    .photo-placeholder {
      width: 100%;
      height: 420px;
      background: #eeeae4;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 45px;
    }

    .message {
      font-size: 15px;
      line-height: 2;
      color: #555;
    }

    .scroll {
      margin-top: 50px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="invitation">

    <section class="main">

      <div class="small-title">
        OUR WEDDING DAY
      </div>

      <h1>
        신랑 & 신부
      </h1>

      <div class="date">
        2027. 06. 13 SAT
      </div>

      <div class="photo-placeholder">
        WEDDING PHOTO
      </div>

      <div class="message">
        저희 두 사람이 사랑으로 만나<br>
        이제 하나의 길을 걸어가려 합니다.<br><br>

        소중한 분들을 모시고<br>
        기쁨의 순간을 함께하고 싶습니다.
      </div>

      <div class="scroll">
        SCROLL ↓
      </div>

    </section>

  </div>

</body>
</html>
